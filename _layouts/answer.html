---
layout: default
---
<section class="answer-hero">
  <div class="container narrow">
    <a class="back-link" href="{{ '/' | relative_url }}">← Tamam sawalat</a>
    <div class="answer-meta">
      <span class="badge">Sawal {{ page.number }}</span>
      {% if page.category %}<span class="category">{{ page.category }}</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </div>
</section>

<section class="answer-section">
  <div class="container answer-layout">
    <article class="prose" id="answerContent">
      {{ content }}
      <div class="share-box">
        <strong>Is jawab ka link share karein</strong>
        <button type="button" class="btn secondary" data-copy-link>Link Copy</button>
      </div>
    </article>
    <aside class="toc-card">
      <strong>Is page mein</strong>
      <nav id="toc"></nav>
    </aside>
  </div>
</section>
